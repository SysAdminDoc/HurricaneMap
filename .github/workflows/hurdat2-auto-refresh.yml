name: HURDAT2 Auto-Refresh

on:
  schedule:
    # NOAA usually posts final post-season HURDAT2 refreshes in late winter or spring.
    - cron: '0 6 1 * *'
  workflow_dispatch:

concurrency:
  group: hurdat2-auto-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install Node.js dependencies
        run: npm ci

      - name: Detect and download latest NOAA HURDAT2 files
        id: refresh
        run: node scripts/refresh-hurdat2.mjs --apply

      - name: Preprocess refreshed HURDAT2 data
        if: steps.refresh.outputs.changed == 'true'
        run: python scripts/preprocess_hurdat2.py

      - name: Verify regenerated datasets
        if: steps.refresh.outputs.changed == 'true'
        run: npm run build

      - name: Summarize generated diff
        if: steps.refresh.outputs.changed == 'true'
        id: diff
        shell: bash
        run: |
          {
            echo 'data_diff<<EOF'
            git diff --stat -- \
              data/hurdat2-atlantic.txt \
              data/hurdat2-nepac.txt \
              data/landfalls.json \
              data/storms.json \
              data/stats.json \
              data/metadata.json
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Create HURDAT2 refresh pull request
        if: steps.refresh.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v5
        with:
          branch: chore/hurdat2-refresh
          delete-branch: true
          commit-message: 'chore(data): refresh HURDAT2 from NOAA'
          title: 'chore(data): refresh HURDAT2 from NOAA'
          body: |
            ## HURDAT2 Auto-Refresh

            NOAA published a newer HURDAT2 source file and this workflow regenerated the derived app datasets.

            Source files detected:
            - Atlantic: `${{ steps.refresh.outputs.atlantic_file }}` (`changed=${{ steps.refresh.outputs.atlantic_changed }}`)
            - NE/NC Pacific: `${{ steps.refresh.outputs.nepac_file }}` (`changed=${{ steps.refresh.outputs.nepac_changed }}`)

            Verification run:
            - `node scripts/refresh-hurdat2.mjs --apply`
            - `python scripts/preprocess_hurdat2.py`
            - `npm run build`

            Data diff:
            ```text
            ${{ steps.diff.outputs.data_diff }}
            ```

            Review the generated data diff, then merge when the app preview and quality checks pass.
          labels: 'data-update'
          add-paths: |
            data/hurdat2-atlantic.txt
            data/hurdat2-nepac.txt
            data/landfalls.json
            data/storms.json
            data/stats.json
            data/metadata.json

      - name: Report no changes
        if: steps.refresh.outputs.changed == 'false'
        run: echo "No HURDAT2 updates detected. Local data already matches NOAA."
