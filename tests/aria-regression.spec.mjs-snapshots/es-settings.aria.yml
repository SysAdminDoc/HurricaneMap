    - heading "Vistas guardadas" [level=3]
    - paragraph: /Las vistas guardadas nunca incluyen direcciones ni ubicaciones seleccionadas\. La ubicación del dispositivo permanece solo durante la sesión, salvo que decidas recordarla durante \d+ horas\./
