- dialog "Configuración":
  - heading "Configuración" [level=2]
  - paragraph: Ajusta unidades, accesibilidad y capas de tormentas activas. Los cambios quedan en este dispositivo.
  - region "Lectura":
    - heading "Lectura" [level=3]
    - text: Unidades de viento
    - paragraph: Se usa en paneles, gráficos y exportaciones.
    - radiogroup "Unidad de viento":
      - radio "Nudos" [checked]
      - radio "mph"
      - radio "km/h"
    - text: Cifras de daños
    - paragraph: Compara pérdidas históricas como fueron reportadas o ajustadas por IPC.
    - radiogroup "Ajuste de daños":
      - radio "Nominal"
      - radio /USD \d+/ [checked]
    - text: Idioma
    - paragraph: Actualiza las etiquetas sin cambiar los datos.
    - radiogroup "Idioma":
      - radio "English"
      - radio "Español" [checked]
      - radio "Kreyòl"
  - region "Apariencia":
    - heading "Apariencia" [level=3]
    - text: Tema
    - paragraph: Elige la interfaz del mapa que funcione mejor con tu iluminación.
    - radiogroup "Tema":
      - radio "Oscuro" [checked]
      - radio "Claro"
      - radio "Sistema"
    - text: Paleta de colores
    - paragraph: Mantiene el significado de las categorías en el mapa y los paneles.
    - radiogroup "Paleta de colores":
      - radio "Predeterminada" [checked]
      - radio "Daltonismo"
    - checkbox "Modo de alto contraste Refuerza texto, bordes y enfoques."
    - text: Modo de alto contraste Refuerza texto, bordes y enfoques.
    - checkbox "Reducir movimiento Mantiene cambios claros con menos animación." [checked]
    - text: Reducir movimiento Mantiene cambios claros con menos animación.
  - region "Ayudas de tormentas activas":
    - heading "Ayudas de tormentas activas" [level=3]
    - checkbox "Cono y trayectoria del NHC Aparece solo cuando hay geometría oficial disponible." [checked]
    - text: Cono y trayectoria del NHC Aparece solo cuando hay geometría oficial disponible.
    - checkbox "Perspectiva tropical del NHC Muestra las perturbaciones oficiales actuales y sus probabilidades de formación." [checked]
    - text: Perspectiva tropical del NHC Muestra las perturbaciones oficiales actuales y sus probabilidades de formación.
    - checkbox /Perspectiva de avisos de viento marino Muestra las zonas de riesgo de avisos de viento mar adentro del NHC para 0–\d+ horas\./
    - text: /Perspectiva de avisos de viento marino Muestra las zonas de riesgo de avisos de viento mar adentro del NHC para 0–\d+ horas\./
    - checkbox "Fondo satelital GOES Agrega imágenes en vivo detrás de tormentas activas cuando están disponibles."
    - text: Fondo satelital GOES Agrega imágenes en vivo detrás de tormentas activas cuando están disponibles.
    - button "Reproducir gira de bienvenida"
  - region "Diagnóstico de datos opcionales":
