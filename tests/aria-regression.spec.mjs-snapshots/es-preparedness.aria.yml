- region "Preparación para huracanes":
  - button "Minimizar preparación para huracanes"
  - button "Cerrar preparación para huracanes": ×
  - heading "Preparación para huracanes" [level=2]
  - paragraph: Prepare un kit de evacuación para tres días o uno para permanecer en casa durante dos semanas. Su progreso queda en este dispositivo y funciona sin conexión.
  - link "Ready.gov":
    - /url: https://www.ready.gov/kit
  - link "American Red Cross":
    - /url: https://www.redcross.org/get-help/how-to-prepare-for-emergencies/survival-kit-supplies.html
