- dialog "Settings":
  - heading "Settings" [level=2]
  - paragraph: Tune units, accessibility, and live-storm layers. Changes stay on this device.
  - region "Reading":
    - heading "Reading" [level=3]
    - text: Wind units
    - paragraph: Used in panels, charts, and exports.
    - radiogroup "Wind unit":
      - radio "Knots" [checked]
      - radio "mph"
      - radio "km/h"
    - text: Damage figures
    - paragraph: Compare historical losses either as reported or CPI-adjusted.
    - radiogroup "Damage adjustment":
      - radio "Nominal"
      - radio /\d+ USD/ [checked]
    - text: Language
    - paragraph: Updates interface labels without changing data.
    - radiogroup "Language":
      - radio "English" [checked]
      - radio "Español"
      - radio "Kreyòl"
  - region "Appearance":
    - heading "Appearance" [level=3]
    - text: Theme
    - paragraph: Choose the map chrome that fits your lighting.
    - radiogroup "Theme":
      - radio "Dark" [checked]
      - radio "Light"
      - radio "System"
    - text: Color palette
    - paragraph: Keeps category color meaning consistent across the map and panels.
    - radiogroup "Color palette":
      - radio "Default" [checked]
      - radio "Colorblind"
    - checkbox "High-contrast mode Strengthens text, borders, and focus outlines."
    - text: High-contrast mode Strengthens text, borders, and focus outlines.
    - checkbox "Reduce motion Keeps state changes clear with less animation." [checked]
    - text: Reduce motion Keeps state changes clear with less animation.
  - region "Live storm aids":
    - heading "Live storm aids" [level=3]
    - checkbox "NHC forecast cone and track Appears only when official active-storm geometry is available." [checked]
    - text: NHC forecast cone and track Appears only when official active-storm geometry is available.
    - checkbox "NHC tropical outlook Shows current official disturbance areas and formation chances." [checked]
    - text: NHC tropical outlook Shows current official disturbance areas and formation chances.
    - checkbox /Marine wind-warning outlook Shows NHC 0–\d+ hour offshore wind-warning risk zones\./
    - text: /Marine wind-warning outlook Shows NHC 0–\d+ hour offshore wind-warning risk zones\./
    - checkbox "GOES satellite backdrop Adds live imagery behind active storms when tiles are reachable."
    - text: GOES satellite backdrop Adds live imagery behind active storms when tiles are reachable.
    - button "Replay welcome tour"
  - region "Optional data diagnostics":
    - heading "Optional data diagnostics" [level=3]
    - paragraph: Live and on-demand source health. Failed refreshes retain labeled last-good data when available.
    - list:
