  - region "Offline storage":
    - heading "Offline storage" [level=3]
    - paragraph: Core historical data is protected. Source files are an optional, user-saved bundle; map tiles and radar packs can be cleared independently.
    - strong: 0 B / 6.0 GB (0%)
    - text: Browser-managed storage
    - list:
      - listitem:
        - strong: Application shell
        - text: Protected · 0 entries · 0 B
      - listitem:
        - strong: Historical data
        - text: Protected · 0 entries · 0 B
      - listitem:
        - strong: Map tiles
        - text: Optional · 0 entries · 0 B
        - button "Clear"
