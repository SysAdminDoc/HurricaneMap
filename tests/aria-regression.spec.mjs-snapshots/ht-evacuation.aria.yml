  - heading "Chèche zòn evakyasyon" [level=2]
  - paragraph: "Konfidansyalite: adrès ou tape yo ale bay World Geocoding Service Esri. Opsyon pwen sou kat la voye sèlman latitid/longitid bay kouch ArcGIS Florid la; HurricaneMap pa konsève okenn nan yo."
  - paragraph: Tcheke yon adrès oswa yon pwen sou kat Florid la nan kouch zòn evakyasyon eta a pibliye. Adrès yo ale bay Esri; pwen yo voye sèlman kowòdone. Pou lòt eta yo, sèvi ak sous ofisyèl ki anba a.
  - text: Adrès nan Florid
  - searchbox "Adrès nan Florid"
  - button "Jwenn zòn"
  - text: Yo voye adrès ou bay World Geocoding Service Esri. Pwen sou kat la voye sèlman latitid/longitid bay kouch ArcGIS Florid la. HurricaneMap pa konsève okenn nan yo.
  - button "Chwazi yon pwen sou kat la"
  - status:
    - paragraph: Antre yon adrès Florid oswa chwazi yon pwen sou kat la. Yon pwen evite jeokodaj adrès la.
  - paragraph: Zòn evakyasyon baze sou risk vag tanpèt epi yo pa menm ak zòn inondasyon FEMA.
  - heading "Sous ofisyèl eta yo" [level=3]
