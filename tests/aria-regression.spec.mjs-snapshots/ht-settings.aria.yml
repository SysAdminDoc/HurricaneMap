- dialog "Paramèt":
  - heading "Paramèt" [level=2]
  - paragraph: Ajiste inite, aksè, ak kouch tanpèt aktif. Chanjman yo rete sou aparèy sa a.
  - region "Lekti":
    - heading "Lekti" [level=3]
    - text: Inite van
    - paragraph: Itilize nan panno, graf, ak ekspòtasyon.
    - radiogroup "Inite van":
      - radio "Ne" [checked]
      - radio "mph"
      - radio "km/h"
    - text: Chif domaj
    - paragraph: Konpare pèt istorik jan yo rapòte yo oswa ajiste ak CPI.
    - radiogroup "Ajisteman domaj":
      - radio "Nominal"
      - radio /USD \d+/ [checked]
    - text: Lang
    - paragraph: Mete etikèt yo ajou san chanje done yo.
    - radiogroup "Lang":
      - radio "English"
      - radio "Español"
      - radio "Kreyòl" [checked]
  - region "Aparans":
    - heading "Aparans" [level=3]
    - text: Tèm
    - paragraph: Chwazi aparans kat la pou limyè kote w ye a.
    - radiogroup "Tèm":
      - radio "Fonse" [checked]
      - radio "Klè"
      - radio "Sistèm"
    - text: Palèt koulè
    - paragraph: Kenbe siyifikasyon kategori yo menm sou kat ak panno.
    - radiogroup "Palèt koulè":
      - radio "Pa defo" [checked]
      - radio "Pou je ki pa wè koulè"
    - checkbox "Gwo kontrast Fè tèks, bòdi, ak konsantrasyon pi fò."
    - text: Gwo kontrast Fè tèks, bòdi, ak konsantrasyon pi fò.
    - checkbox "Diminye mouvman Kenbe chanjman yo klè ak mwens animasyon." [checked]
    - text: Diminye mouvman Kenbe chanjman yo klè ak mwens animasyon.
  - region "Èd pou tanpèt aktif":
    - heading "Èd pou tanpèt aktif" [level=3]
    - checkbox "Kòn ak tras NHC Parèt sèlman lè jeyometri ofisyèl disponib." [checked]
    - text: Kòn ak tras NHC Parèt sèlman lè jeyometri ofisyèl disponib.
    - checkbox "Pèspektiv twopikal NHC Montre deranjman ofisyèl aktyèl yo ak chans pou yo fòme." [checked]
    - text: Pèspektiv twopikal NHC Montre deranjman ofisyèl aktyèl yo ak chans pou yo fòme.
    - checkbox /Pèspektiv avètisman van sou lanmè Montre zòn risk avètisman van NHC pou 0–\d+ èdtan sou lanmè\./
    - text: /Pèspektiv avètisman van sou lanmè Montre zòn risk avètisman van NHC pou 0–\d+ èdtan sou lanmè\./
    - checkbox "Fon satelit GOES Ajoute imaj an dirèk dèyè tanpèt aktif lè li disponib."
    - text: Fon satelit GOES Ajoute imaj an dirèk dèyè tanpèt aktif lè li disponib.
    - button "Rejwe vizit byenveni"
